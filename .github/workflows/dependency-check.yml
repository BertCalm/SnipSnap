name: dependency-check

# Weekly and on-demand, not on every push or PR — see tests.yml's own
# header for why this repo's CI minutes are metered. The difference here:
# a CVE disclosure doesn't move between two commits ten minutes apart the
# way a code change does, so this job's real cadence is "at least once a
# week", not "every push". A High/Critical finding does fail this job
# (build.gradle.kts sets failBuildOnCVSS = 7.0), so it shows red in
# Actions and the report still uploads via if: always() - it just never
# blocks a PR merge, since this workflow isn't part of what gates one.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # dependencyCheckAggregate configures :app to see its Android/AndroidX
      # dependencies too - same reason jvm-tests needs this in tests.yml.
      - uses: android-actions/setup-android@v3
      # The plugin downloads and caches the NVD/CISA-KEV feeds under the
      # Gradle user home; without this every run re-fetches gigabytes of
      # CVE data from scratch instead of just the delta since last week.
      #
      # Keyed on the run id, deliberately unique every time: GitHub's
      # cache backend is immutable per key, so a STABLE key (tried here
      # first, then reverted) would hit on every later run and therefore
      # never save again after the first - the cached database would be
      # frozen as of whenever it was first written, doing a bigger and
      # bigger incremental update against an ever-stabler base instead of
      # ever persisting that update back. restore-keys still restores the
      # most recent prior run's cache as that base, so this only costs a
      # fresh upload each run (this workflow's own cadence is weekly plus
      # occasional workflow_dispatch, not every push) in exchange for the
      # cache actually staying current, which is the entire point of it.
      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-data-
      - name: Scan every module's dependencies for known vulnerabilities
        # NVD_API_KEY is optional (build.gradle.kts treats an unset or
        # blank secret as no key at all) but strongly recommended: NVD
        # rate-limits unauthenticated requests hard enough to make a
        # from-scratch database build unreliable. A free key comes from
        # https://nvd.nist.gov/developers/request-an-api-key - set it as
        # the NVD_API_KEY repository secret to use one.
        run: ./gradlew --no-daemon dependencyCheckAggregate
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30
