name: emulator-tests

# The on-device suite (app/src/androidTest): Compose UI tests on an
# emulator. The half of the SURFACE phone pass a machine can see - a label
# cut to "TA..." at a phone's width, a button that does not flip, a second
# finger the pad does not read - fails here instead of waiting for a tester
# to notice.
#
# Booting an emulator is the most expensive thing this repo asks of its
# metered minutes (ten to fifteen a run against three for the app build),
# so this workflow runs only when something under app/ changes, and the
# same once-per-branch and cancel-superseded rules as tests.yml apply.
# Anything else that wants it can start it by hand (workflow_dispatch).
on:
  push:
    branches: [claude/mobile-mpc-drum-sampler-t58x74]
    paths:
      - "app/**"
      - ".github/workflows/emulator-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/emulator-tests.yml"
  workflow_dispatch:
    inputs:
      filament_only:
        description: Run only the Filament phone tests
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      # DIAGNOSTIC (not for merge): run :shell:test the way jvm-tests does,
      # with suite-level failures printed, the GC log and any JVM crash file
      # kept, and the runner's memory sampled every 15 s.
      - name: Run the shell tests with diagnostics
        run: |
          mkdir -p diag
          (while true; do date -u +%T; free -m | sed -n 2p; ps -eo rss,args --sort=-rss | head -4 | cut -c1-160; sleep 15; done) > diag/memory.txt 2>&1 &
          ./gradlew --no-daemon --init-script scripts/diagnose-shell-tests.gradle :shell:test
      - name: Kernel messages
        if: always()
        run: sudo dmesg | tail -60 > diag/dmesg.txt || true
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-diagnostics
          path: |
            diag/**
            shell/build/reports/tests/test/**
            shell/build/test-results/test/**
            shell/hs_err_*.log
          if-no-files-found: ignore
          retention-days: 7
