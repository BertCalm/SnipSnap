name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The Android SDK is required from the moment :app exists: AGP resolves it
      # at configuration time, so without it every module fails to configure and
      # all the pure-JVM tests go red for a reason that has nothing to do with
      # them.
      - uses: android-actions/setup-android@v3
      # Everything except :app, by exclusion rather than by list — a module added
      # later must not be silently untested because nobody updated this line.
      - name: Run JVM test suites
        run: ./gradlew --no-daemon test -x :app:test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Assemble the app
        run: ./gradlew --no-daemon :app:assembleDebug

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native engines on the host: no NDK, no device. The audio callbacks
      # are driven by hand and the DSP and handshakes asserted; Oboe is headers
      # only here (fetched from the pinned release by the test's CMake).
      - name: Configure
        run: cmake -S app/src/main/cpp/test -B build/native-tests
      - name: Build
        run: cmake --build build/native-tests
      - name: Run the engine tests
        run: ctest --test-dir build/native-tests --output-on-failure
