name: tests

# Three rules keep this from costing more than it is worth. They date from
# when the repo was private and every minute here was metered: on
# 2026-09-10 a night of three agents working in parallel exhausted the
# month's allowance, and every run then failed in three seconds with no
# logs, which looks exactly like a broken build and is not one. The repo is
# public now (checked 2026-11-06: the runs bill 0 minutes), so runner time
# is free and the JVM tests run on four runners at once (see the comment
# above jvm-other). The rules still stand, because each one saves waiting.
#
# 1. A branch is tested ONCE. `push: ["**"]` plus `pull_request` ran the whole
#    suite twice for every push to a branch with a PR open - the paired runs
#    in the history (743+744, 745+746, 747+748, all on one SHA). Push now
#    covers only the default branch, where a merge lands and where
#    setup-gradle writes the cache the PR runs read; everything else is a PR
#    and `pull_request` covers it.
# 2. A superseded run is cancelled. Fixing a red build means pushing two or
#    three times in ten minutes, and without this every one of those runs to
#    completion on a commit nobody will look at again. Default-branch runs
#    are never cancelled: they write the cache and record what merged.
# 3. Documentation does not build anything. No test reads docs/ or a .md
#    file, with two exceptions: ConventionTest reads README.md and
#    app/README.md (the picker lists and counts), so those two are listed
#    back in below. A later positive pattern re-includes what an earlier
#    `!` excluded; `paths` and `paths-ignore` cannot be combined. (`reference/`
#    is fixture data and is deliberately NOT excluded - the audio and
#    MPC-importer suites read it.)
on:
  push:
    branches: [claude/mobile-mpc-drum-sampler-t58x74]
    # Repeated rather than shared with a YAML anchor: GitHub Actions'
    # workflow parser does not support anchors or aliases, however happily
    # every other YAML tool reads them.
    paths:
      - "**"
      - ".github/**"
      - "!docs/**"
      - "!**/*.md"
      - "README.md"
      - "app/README.md"
  pull_request:
    paths:
      - "**"
      - ".github/**"
      - "!docs/**"
      - "!**/*.md"
      - "README.md"
      - "app/README.md"

concurrency:
  # One in flight per PR (or per branch for the default-branch push).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The JVM tests run on four runners at once: jvm-other takes every module
  # but :synth, and jvm-synth takes :synth in three shards (a class-hash
  # split, see "Sharding by test class" in the root build.gradle.kts). One
  # job used to run them all in turn and took 2 h, 88.6 min of it :synth.
  # jvm-tests, at the end, is the one check that says all of them passed.
  jvm-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # :app is included only when an SDK is located (settings.gradle.kts).
      # This job installs one so :app is in the graph and `-x :app:test`
      # has something to exclude. A machine with no SDK leaves :app out
      # and the nine JVM modules configure on their own; copying the
      # `-x :app:test` line into that session fails because there is no
      # :app to exclude.
      #
      # packages: '' skips this action's own default install (`tools
      # platform-tools`) — Google removed the legacy `tools` package from
      # the live SDK repository, so that default now fails every run with
      # "Failed to find package 'tools'" before a single test executes.
      # The action still stands up ANDROID_HOME and accepts the SDK
      # licenses with an empty package list; AGP downloads the specific
      # platform/build-tools app/build.gradle.kts's compileSdk actually
      # needs on its own the moment Gradle configures :app.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      # Everything except :app and :synth, by exclusion rather than by list —
      # a module added later must not be silently untested because nobody
      # updated this line. :synth runs in jvm-synth.
      - name: Run JVM test suites except :synth
        # Release the Kotlin compiler once it is idle, so its heap does not
        # sit beside the test JVMs (one per CPU). Busy compilation stays alive.
        run: >-
          ./gradlew --no-daemon
          -Dkotlin.daemon.options=autoshutdownIdleSeconds=30
          test -x :app:test -x :synth:test
      # A worker/framework failure can leave only a skipped method and a
      # generic Gradle error in the console. Retain the actual failure.
      - name: Keep JVM failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Each JVM job names its own, so two failing jobs do not collide.
          name: jvm-test-reports-other-${{ github.sha }}
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            **/build/reports/problems/**
          if-no-files-found: warn
          retention-days: 3

  jvm-synth:
    name: jvm-synth (shard ${{ strategy.job-index }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide another.
      fail-fast: false
      matrix:
        # The number of entries is the number of shards. The build reads the
        # count and the index from strategy.job-total and strategy.job-index
        # below, never from this list, so adding a shard is adding an entry.
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # See jvm-other's identical step for why packages is empty.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      # One shard of :synth's test classes. To run the same shard locally:
      # ./gradlew --no-daemon :synth:test -PtestShards=3 -PtestShard=<index>
      - name: Run one shard of :synth's tests
        run: >-
          ./gradlew --no-daemon
          -Dkotlin.daemon.options=autoshutdownIdleSeconds=30
          :synth:test
          -PtestShards=${{ strategy.job-total }}
          -PtestShard=${{ strategy.job-index }}
      - name: Keep JVM failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-synth-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            **/build/reports/problems/**
          if-no-files-found: warn
          retention-days: 3

  # The one check that says every JVM test passed, under the name the single
  # job had, so anything that waits on `jvm-tests` still waits on all of them.
  jvm-tests:
    needs: [jvm-other, jvm-synth]
    # !cancelled() rather than always(): a superseded PR run is cancelled and
    # this job goes with it, but a failed test job must still reach the step
    # below and turn this red. Without the `if`, a failure upstream SKIPS this
    # job, and GitHub counts a skipped check as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every JVM test job passed
        env:
          # One result per job named in `needs`; jvm-synth's is all its shards.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jvm-other, jvm-synth: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A JVM test job ended '$result'. Its log names the failing test."
              exit 1
            fi
          done

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # See jvm-other's identical step for why packages is empty.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      # This job compiles :app three times at once (debug, strikeFx,
      # creaseStudy) in one Kotlin compiler, and the 3 GiB gradle.properties
      # gives it ran out twice on 2026-11-06 ("Not enough memory to run
      # compilation", #917 and #920; a re-run passed each time). 5 GiB is for
      # this job only: the JVM test jobs compile less and keep 3 GiB beside
      # their test JVMs. The runner has 16 GiB.
      - name: Assemble the app and compile device tests
        run: ./gradlew --no-daemon -PcreaseStudyBuild=true -Pkotlin.daemon.jvmargs=-Xmx5g :app:testDebugUnitTest :app:assembleDebug :app:assembleStrikeFx :app:compileDebugAndroidTestKotlin :app:testCreaseStudyUnitTest :app:compileCreaseStudyKotlin
      # The job already builds a working APK and then throws it away with
      # the runner. Keeping it is the difference between "the app compiles"
      # and "here is the app" — every green build on every branch becomes
      # something installable, which is the only way anything here gets
      # heard until there is a release path.
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          # The SHA is in the name because several branches build at once
          # and a download called `app-debug` tells you nothing about which
          # one you are holding.
          name: snipsnap-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # A private repo meters artifact storage as well as minutes, and
          # the default is 90 days - hundreds of APKs nobody will install
          # after the evening they were built. A week is longer than any of
          # these has ever stayed interesting.
          retention-days: 7

      - name: Keep the separately installable STRIKE FX demo
        uses: actions/upload-artifact@v4
        with:
          name: snipsnap-strike-fx-${{ github.sha }}
          path: app/build/outputs/apk/strikeFx/app-strikeFx.apk
          if-no-files-found: error
          retention-days: 7

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native engines on the host: no NDK, no device. The audio callbacks
      # are driven by hand and the DSP and handshakes asserted; Oboe is headers
      # only here (fetched from the pinned release by the test's CMake).
      # The production CMake and the harness name the engine sources
      # separately. This fails the job when a new .cpp lands in only one.
      - name: Phone study admission checks
        run: python3 -m unittest discover -s scripts/crease-release -p test_prepare_phone.py
      - name: Engine sources are named in both CMake files
        run: python3 scripts/check_native_sources.py
      - name: Configure
        run: cmake -S app/src/main/cpp/test -B build/native-tests
      - name: Build
        run: cmake --build build/native-tests
      - name: Run the engine tests
        run: ctest --test-dir build/native-tests --output-on-failure
