<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.mark{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:13px;line-height:1.3;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.sunken{background:#161020;border:1px solid #2A2044;border-radius:4px;}
.drow{background:#0A0714;border:1px solid #2A2044;border-radius:5px;padding:0 8px;display:flex;align-items:center;gap:8px;height:52px;}
</style>
</helmet>
<div style="width: 390px; height: 400px; background: #0C0618; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: 1; margin: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

<div style="height: 44px; flex: none; display: flex; align-items: center; padding: 0 10px;" class="lcd">
  <div style="width: 72px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #7A6AA0; border-radius: 3px;"><span class="px" style="color: #C8B2F8;">◄ SHELF</span></div>
  <span class="lcdf glow" style="color: #C8B2F8; font-size: 21px; flex: 1; text-align: center;">DELETED KITS</span>
  <span class="lcdf" style="color: #40E0E8; font-size: 17px; white-space: nowrap;">2</span>
</div>

<div class="sunken" style="flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;">

  <div class="drow">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span class="mark" style="color: #C8B2F8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">ROCK SALT</span>
      <span class="pxs" style="color: #7A6AA0;">12 PADS  ·  3D AGO</span>
    </div>
    <span class="lcdf" style="color: #FFB000; font-size: 17px; white-space: nowrap;">2D LEFT</span>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #40E0E8; border-radius: 4px; padding: 0 8px;"><span class="pxs" style="color: #40E0E8; white-space: nowrap;">RESTORE</span></div>
  </div>

  <div class="drow">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span class="mark" style="color: #C8B2F8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">FUNK KIT</span>
      <span class="pxs" style="color: #7A6AA0;">8 PADS  ·  JUST NOW</span>
    </div>
    <span class="lcdf" style="color: #40E0E8; font-size: 17px; white-space: nowrap;">27D LEFT</span>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #40E0E8; border-radius: 4px; padding: 0 8px;"><span class="pxs" style="color: #40E0E8; white-space: nowrap;">RESTORE</span></div>
  </div>

</div>

<div style="height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #0A0714; border: 2px solid #6A2020; border-radius: 5px;"><span class="px" style="color: #C86050;">EMPTY THE BIN NOW — NO TAKEBACKS</span></div>

</div>
</div>
</x-dc>
</body>
</html>
