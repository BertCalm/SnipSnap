<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.mark{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:13px;line-height:1.3;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.raised{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;}
.sunken{background:#161020;border:1px solid #2A2044;border-radius:4px;}
.brow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#6A2020,#060410) border-box;border:2px solid transparent;border-radius:4px;}
</style>
</helmet>
<div style="width:390px;height:520px;background:#0C0618;display:flex;flex-direction:column;overflow:hidden;">
<div style="flex:1;margin:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;">

<div style="height:44px;flex:none;display:flex;align-items:center;padding:0 10px;gap:8px;" class="lcd">
  <div style="width:72px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #7A6AA0;border-radius:3px;"><span class="px" style="color:#C8B2F8;">◄ SNIPS</span></div>
  <span class="lcdf glow" style="color:#C8B2F8;font-size:21px;flex:1;">DELETED SNIPS</span>
  <span class="lcdf" style="color:#FFB000;font-size:17px;">2</span>
</div>

<div class="pxs" style="color:#584A80;padding:0 2px;">WHAT SNIPS' DELETE SENT HERE. THE BIN KEEPS IT 30 DAYS.</div>

<div class="sunken" style="flex:1;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:hidden;">

  <div class="brow">
    <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
      <span class="mark" style="color:#C8B2F8;">14 MIN AGO</span>
      <span class="pxs" style="color:#7A6AA0;">312.0 KB · KICK-ISH · CAPTURE 09-11</span>
    </div>
    <span class="lcdf" style="color:#40E0E8;font-size:17px;">27D LEFT</span>
    <div class="raised" style="width:72px;height:44px;display:flex;align-items:center;justify-content:center;"><span class="px" style="color:#FFB000;">RESTORE</span></div>
  </div>

  <div class="brow">
    <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
      <span class="mark" style="color:#C8B2F8;">28D AGO</span>
      <span class="pxs" style="color:#7A6AA0;">1.2 MB · LOOP · CAPTURE 08-14</span>
    </div>
    <span class="lcdf" style="color:#FFB000;font-size:17px;">2D LEFT</span>
    <div class="raised" style="width:72px;height:44px;display:flex;align-items:center;justify-content:center;"><span class="px" style="color:#FFB000;">RESTORE</span></div>
  </div>

</div>

<div style="height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:#0A0714;border:2px solid #6A2020;border-radius:6px;"><span class="px" style="color:#C86050;">EMPTY THE BIN NOW — NO TAKEBACKS</span></div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:520}}"></script>
</body>
</html>
