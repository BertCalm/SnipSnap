<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.disp{font-family:'Michroma','Verdana',sans-serif;font-size:11px;letter-spacing:2px;line-height:1.2;text-transform:uppercase;}
.mark{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:13px;line-height:1.3;}
.markb{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:15px;line-height:1.3;}
.raised{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;}
.pressed{background:linear-gradient(#1B1429,#1B1429) padding-box,linear-gradient(135deg,#060410,#40306A) border-box;border:2px solid transparent;border-radius:4px;}
.sunken{background:linear-gradient(#161020,#161020) padding-box,linear-gradient(135deg,#060410,#40306A) border-box;border:1px solid transparent;border-radius:4px;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.glowalt{text-shadow:0 0 6px rgba(64,224,232,.8);}
.key{border-radius:6px;border:2px solid;display:flex;align-items:flex-end;justify-content:flex-start;padding:5px;}
.keyon{background:#1E1830;border-color:#C8B2F8;}
.keyoff{background:#17121F;border-color:rgba(200,178,248,0.3);}
</style>
</helmet>
<div style="width: 390px; height: 520px; background: #0C0618; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: 1; margin: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

<div style="height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px;" class="lcd">
  <span class="lcdf glow" style="color: #C8B2F8; font-size: 21px;">TAPE PIANO</span>
  <span class="lcdf" style="color: #40E0E8; font-size: 17px;">ROOT C4  OCT +0</span>
</div>

<div style="display: flex; gap: 6px; flex: none;">
  <div class="raised" style="flex: none; padding: 0 10px; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="px" style="color: #C8B2F8; white-space: nowrap;">◄ SHELF</span></div>
  <div class="raised" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="px" style="color: #C8B2F8;">OCT −</span></div>
  <div class="raised" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="px" style="color: #C8B2F8;">OCT +</span></div>
</div>

<div style="display: flex; gap: 4px; flex: none;">
  <div class="raised" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="pxs" style="color: #7A6AA0;">CHROMATIC</span></div>
  <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(64,224,232,0.85);"><span class="pxs" style="color: #FFFFFF;">MAJOR</span></div>
  <div class="raised" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="pxs" style="color: #7A6AA0;">MINOR</span></div>
  <div class="raised" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="pxs" style="color: #7A6AA0;">MIN PENT</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
  <div style="display: flex; gap: 8px; flex: 1;">
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">A5</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">B5</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">C6</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">D6</span></div>
  </div>
  <div style="display: flex; gap: 8px; flex: 1;">
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">D5</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">E5</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">F5</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">G5</span></div>
  </div>
  <div style="display: flex; gap: 8px; flex: 1;">
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">G4</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">A4</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">B4</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">C5</span></div>
  </div>
  <div style="display: flex; gap: 8px; flex: 1;">
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">C4</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">D4</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">E4</span></div>
    <div class="key keyon" style="flex: 1;"><span class="mark" style="color: #C8B2F8;">F4</span></div>
  </div>
</div>

</div>
</div>
</x-dc>
</body>
</html>
