<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.disp{font-family:'Michroma','Verdana',sans-serif;font-size:12px;letter-spacing:2px;line-height:1.2;text-transform:uppercase;}
.mark{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:13px;line-height:1.3;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.sweep{border:2px solid transparent;border-radius:6px;background:linear-gradient(#0A0714,#0A0714) padding-box,conic-gradient(#5A2AE0,#E040C8,#40E0E8,#8A5AF0,#5A2AE0) border-box;}
.sunken{background:#161020;border:1px solid #2A2044;border-radius:4px;}
</style>
</helmet>
<div style="width: 390px; height: 420px; background: #0C0618; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: 1; margin: 12px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

<div style="height: 44px; flex: none; display: flex; align-items: center; padding: 0 10px;" class="lcd">
  <div style="width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #7A6AA0; border-radius: 3px;"><span class="px" style="color: #C8B2F8;">◄ KIT</span></div>
  <span class="lcdf glow" style="color: #C8B2F8; font-size: 21px; flex: 1; text-align: center;">PAD A07</span>
  <div style="width: 64px;"></div>
</div>

<div class="lcd" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;">
    <div class="sunken" style="width: 100%; height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 6px; box-sizing: border-box;">
      <div style="flex: 1; height: 14px; background: #161020; position: relative; overflow: hidden;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: #40E0E8;"></div>
      </div>
      <span class="pxs" style="color: #40E0E8; white-space: nowrap;">00:11</span>
    </div>
    <span class="lcdf" style="color: #C8B2F8; font-size: 17px; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">GRAB the sound that just happened, or HOLD to record.</span>
  </div>
</div>

<div class="sweep" style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: center;"><span class="disp" style="color: #C8B2F8; opacity: 0.5;">GRABBING…</span></div>
<div class="sweep" style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: center;"><span class="disp" style="color: #C8B2F8; opacity: 0.5;">HOLD TO REC</span></div>

</div>
</div>
</x-dc>
</body>
</html>
