<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.disp{font-family:'Michroma','Verdana',sans-serif;font-size:11px;letter-spacing:2px;line-height:1.2;text-transform:uppercase;}
.raised{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;}
.sunken{background:linear-gradient(#161020,#161020) padding-box,linear-gradient(135deg,#060410,#40306A) border-box;border:1px solid transparent;border-radius:4px;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.sys{font-family:-apple-system,'Roboto','Segoe UI',sans-serif;}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0C0618; display: flex; flex-direction: column; overflow: hidden; position: relative;">
<div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; filter: brightness(0.5);">
<div style="height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; margin: 12px 12px 0 12px;" class="lcd">
  <span class="lcdf glow" style="color: #C8B2F8; font-size: 21px;">FUNK</span>
  <span class="lcdf" style="color: #40E0E8; font-size: 17px;">C MINOR 92 BPM 16 PADS</span>
</div>
<div style="flex: 1; margin: 12px; padding: 10px; background: #1A1424;"></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1C1C1E; border-radius: 16px 16px 0 0; padding: 10px 16px 24px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 28px rgba(0,0,0,.5);">
  <div style="width: 36px; height: 4px; border-radius: 2px; background: #48484A; align-self: center;"></div>
  <span class="sys" style="color: #F2F2F2; font-size: 15px; font-weight: 600;">Share &ldquo;FUNK.xpn&rdquo;</span>
  <div style="display: flex; gap: 18px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px;"><div style="width: 44px; height: 44px; border-radius: 22px; background: #3A82F7;"></div><span class="sys" style="color: #C7C7CC; font-size: 10px; text-align: center;">Messages</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px;"><div style="width: 44px; height: 44px; border-radius: 22px; background: #34A853;"></div><span class="sys" style="color: #C7C7CC; font-size: 10px; text-align: center;">Drive</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px;"><div style="width: 44px; height: 44px; border-radius: 22px; background: #F2A93B;"></div><span class="sys" style="color: #C7C7CC; font-size: 10px; text-align: center;">Files</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px;"><div style="width: 44px; height: 44px; border-radius: 22px; background: #5F6368;"></div><span class="sys" style="color: #C7C7CC; font-size: 10px; text-align: center;">Bluetooth</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px;"><div style="width: 44px; height: 44px; border-radius: 22px; background: #E8542E;"></div><span class="sys" style="color: #C7C7CC; font-size: 10px; text-align: center;">Mail</span></div>
  </div>
  <div style="height: 1px; background: #38383A;"></div>
  <div style="display: flex; align-items: center; gap: 14px; padding: 4px 0;"><div style="width: 36px; height: 36px; border-radius: 8px; background: #2C2C2E;"></div><span class="sys" style="color: #F2F2F2; font-size: 14px;">Copy to clipboard</span></div>
</div>
</div>
</x-dc>
</body>
</html>
