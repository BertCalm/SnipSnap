<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.mark{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:13px;line-height:1.3;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.raised{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;}
.sunken{background:#161020;border:1px solid #2A2044;border-radius:4px;}
.row{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
</style>
</helmet>
<div style="width: 390px; height: 560px; background: #0C0618; display: flex; flex-direction: column; overflow: hidden; position: relative;">
<div style="flex: 1; margin: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

<div style="height: 44px; flex: none; display: flex; align-items: center; padding: 0 10px;" class="lcd">
  <div style="width: 72px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #7A6AA0; border-radius: 3px;"><span class="px" style="color: #C8B2F8;">◄ SHELF</span></div>
  <span class="lcdf glow" style="color: #C8B2F8; font-size: 21px; flex: 1; text-align: center;">SNIPS</span>
  <span class="lcdf" style="color: #40E0E8; font-size: 17px; white-space: nowrap;">3 · 1.6 MB</span>
</div>

<div class="sunken" style="flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;">
  <div class="row">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span class="mark" style="color: #C8B2F8;">JUST NOW</span>
      <span class="pxs" style="color: #7A6AA0;">312.0 KB</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <div class="raised" style="flex: 1; height: 44px;"></div>
      <div class="raised" style="flex: 1; height: 44px;"></div>
      <div class="raised" style="flex: 1; height: 44px;"></div>
    </div>
    <div style="width: 100%; height: 44px; background: #0A0714; border: 2px solid #6A2020; border-radius: 4px;"></div>
  </div>
</div>

</div>

<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;">
  <div class="row" style="width: 342px; padding: 14px; gap: 10px;">
    <span class="lcdf" style="color: #C8B2F8; font-size: 17px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">DELETE THIS SNIP? CAN'T UNDO.</span>
    <div style="display: flex; gap: 6px;">
      <div class="raised" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;"><span class="px" style="color: #C8B2F8;">CANCEL</span></div>
      <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; background: #0A0714; border: 2px solid #6A2020; border-radius: 4px;"><span class="px" style="color: #C86050;">DELETE</span></div>
    </div>
  </div>
</div>

</div>
</x-dc>
</body>
</html>
