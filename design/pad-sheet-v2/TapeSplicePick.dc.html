<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=Michroma&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
  <style>
body{margin:0;background:#0C0618;}
a{color:#40E0E8;} a:hover{color:#8EEEF4;}
.px{font-family:'Silkscreen','Verdana',sans-serif;font-size:9px;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase;}
.pxs{font-family:'Silkscreen','Verdana',sans-serif;font-size:8px;letter-spacing:0.5px;line-height:1.25;text-transform:uppercase;}
.lcdf{font-family:'VT323','Courier New',monospace;line-height:1;}
.mark{font-family:'Rock Salt','Comic Sans MS',cursive;font-size:13px;line-height:1.3;}
.lcd{background:#0A0714;border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000;}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none;}
.glow{text-shadow:0 0 6px rgba(154,108,240,.9);}
.raised{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;}
.sunken{background:#161020;border:1px solid #2A2044;border-radius:4px;}
.row{background:linear-gradient(#221A34,#221A34) padding-box,linear-gradient(135deg,#40306A,#060410) border-box;border:2px solid transparent;border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
.chip{height:44px;display:flex;align-items:center;justify-content:center;border-radius:4px;}
</style>
</helmet>
<div style="width:390px;height:560px;background:#0C0618;display:flex;flex-direction:column;overflow:hidden;">
<div style="flex:1;margin:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;">

<div style="height:44px;flex:none;display:flex;align-items:center;padding:0 10px;gap:8px;" class="lcd">
  <div style="width:72px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #7A6AA0;border-radius:3px;"><span class="px" style="color:#C8B2F8;">◄ PAD</span></div>
  <span class="lcdf glow" style="color:#C8B2F8;font-size:21px;flex:1;">SPLICE</span>
  <span class="lcdf" style="color:#40E0E8;font-size:17px;">A02</span>
</div>

<div class="pxs" style="color:#7A6AA0;padding:0 2px;">PICK A HEAD AND A TAIL - TWO DIFFERENT TAKES OF THIS PAD.</div>

<div class="sunken" style="flex:1;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:hidden;">

  <div class="row">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="mark" style="color:#FFB000;">LIVE</span>
      <span class="pxs" style="color:#7A6AA0;">-6.2 DBFS · 0.41 S</span>
    </div>
    <div style="display:flex;gap:6px;">
      <div class="raised chip" style="width:48px;"><span class="px" style="color:#C8B2F8;">▶</span></div>
      <div class="chip" style="width:76px;background:#0A0714;border:2px solid #E040C8;"><span class="px" style="color:#F8A8D4;">HEAD</span></div>
      <div class="raised chip" style="width:76px;"><span class="px" style="color:#7A6AA0;">TAIL</span></div>
    </div>
  </div>

  <div class="row">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="mark" style="color:#C8B2F8;">14 MIN AGO</span>
      <span class="pxs" style="color:#7A6AA0;">-4.8 DBFS · 0.52 S</span>
    </div>
    <div style="display:flex;gap:6px;">
      <div class="raised chip" style="width:48px;"><span class="px" style="color:#C8B2F8;">▶</span></div>
      <div class="raised chip" style="width:76px;"><span class="px" style="color:#7A6AA0;">HEAD</span></div>
      <div class="raised chip" style="width:76px;"><span class="px" style="color:#7A6AA0;">TAIL</span></div>
    </div>
  </div>

  <div class="row">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="mark" style="color:#C8B2F8;">YESTERDAY</span>
      <span class="pxs" style="color:#7A6AA0;">-9.1 DBFS · 0.44 S</span>
    </div>
    <div style="display:flex;gap:6px;">
      <div class="raised chip" style="width:48px;"><span class="px" style="color:#C8B2F8;">▶</span></div>
      <div class="raised chip" style="width:76px;"><span class="px" style="color:#7A6AA0;">HEAD</span></div>
      <div class="chip" style="width:76px;background:#0A0714;border:2px solid #E040C8;"><span class="px" style="color:#F8A8D4;">TAIL</span></div>
    </div>
  </div>

  <div class="row" style="opacity:0.55;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="mark" style="color:#7A6AA0;">3D AGO</span>
      <span class="pxs" style="color:#584A80;">WON'T READ</span>
    </div>
  </div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:560}}"></script>
</body>
</html>
