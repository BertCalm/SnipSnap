// Isolated Kotlin port evidence; production source sets and build settings are unchanged.
// JDK17: ./gradlew --offline -I experiments/obliterate-core/port.init.gradle :synth:renderObliteratePort
gradle.projectsEvaluated {
    def synth = gradle.rootProject.project(':synth')
    def runtime = synth.sourceSets.main.runtimeClasspath
    def compiler = synth.configurations.create('obliteratePortCompiler')
    synth.dependencies.add(compiler.name, 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21')
    def repo = gradle.rootProject.projectDir
    def classes = new File(repo, 'build/obliterate-port-helper-classes')
    def props = gradle.startParameter.projectProperties
    def inputs = props.get('obliteratePortInputs') ?: new File(repo, 'testkit/obliterate-kotlin-audition/reference-inputs.json').path
    def output = props.get('obliteratePortOutput') ?: new File(repo, 'testkit/obliterate-kotlin-audition').path
    synth.tasks.register('compileObliteratePortRenderer', JavaExec) {
        dependsOn synth.tasks.named('classes')
        classpath compiler, runtime
        mainClass.set('org.jetbrains.kotlin.cli.jvm.K2JVMCompiler')
        maxHeapSize = '1g'
        doFirst {
            classes.mkdirs()
            args '-jvm-target', '17', '-no-stdlib', '-no-reflect', '-classpath', runtime.asPath,
                '-Xfriend-paths=' + new File(repo, 'synth/build/classes/kotlin/main').path,
                '-d', classes.path, new File(repo, 'experiments/obliterate-core/KotlinPortRenderer.kt').path
        }
    }
    synth.tasks.register('renderObliteratePort', JavaExec) {
        dependsOn synth.tasks.named('compileObliteratePortRenderer')
        // When both tasks are selected, keep compilation/test load outside the benchmark.
        mustRunAfter synth.tasks.named('test')
        mustRunAfter gradle.rootProject.project(':shell').tasks.named('test')
        classpath classes, runtime
        mainClass.set('com.snipsnap.synth.KotlinPortRenderer')
        maxHeapSize = '1g'
        workingDir repo
        args repo.path, new File(inputs).absolutePath, new File(output).absolutePath,
            props.get('obliteratePortWarmups') ?: '3', props.get('obliteratePortTrials') ?: '7'
    }
}
