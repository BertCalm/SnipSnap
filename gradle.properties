# Required by :app (AndroidX); inert for the pure-JVM modules.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
# The Kotlin compile daemon is shared by every module, and with no setting of its own it takes Gradle's
# 2g. Compiling :synth's tests beside :shell's and :cli's, as jvm-tests does, filled its old generation
# (1365 of 1365 MB, 45 full collections taking 56 s, measured locally on 2026-10-31). On CI it then died
# in :synth:compileTestKotlin with "GC overhead limit exceeded" (#752 at de444037); at 1.7g it fails the
# same way locally. At 3g the same compile peaks at 1585 of 2048 MB of old generation, with 10 full
# collections, in 2m24s instead of 3m07s. The cost is about 1 GB more resident in the idle daemon while
# the tests run.
kotlin.daemon.jvmargs=-Xmx3g
