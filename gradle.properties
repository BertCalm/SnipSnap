# Required by :app (AndroidX); inert for the pure-JVM modules.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
# The Kotlin compile daemon is one process for the whole build, so by the
# time `test` reaches :synth's test sources it has compiled every module
# before them, and 2g (inherited from the line above) ran out there:
# "Not enough memory to run compilation" / GC overhead limit exceeded in
# :synth:compileTestKotlin. The hosted runners have 16g.
kotlin.daemon.jvmargs=-Xmx3g
