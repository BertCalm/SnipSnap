// DIAGNOSTIC (not for merge): what ends :shell:test on CI without naming a test.
allprojects {
    tasks.withType(Test).configureEach {
        def diag = rootProject.file("diag")
        diag.mkdirs()
        jvmArgs "-XX:ErrorFile=${diag}/hs_err_%p.log", "-Xlog:gc:file=${diag}/gc-${project.name}-%p.log:time,uptime"
        testLogging {
            minGranularity = 0
            events "failed", "skipped"
        }
        afterSuite { desc, result ->
            if (result.resultType == TestResult.ResultType.FAILURE) {
                println "SUITE FAILED: ${desc} (${desc.className}) -> ${result.exception}"
                result.exceptions.each { e -> println "  " + e.toString(); e.stackTrace.take(15).each { println "    at " + it } }
            }
        }
    }
}
